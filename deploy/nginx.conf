# PhotoFinder Nginx 反向代理配置（含限流）
#
# 部署（Debian/Ubuntu）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/photofinder
#   sudo nano /etc/nginx/sites-available/photofinder   # 改 server_name
#   sudo ln -s /etc/nginx/sites-available/photofinder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：本文件顶部的 limit_req_zone / limit_conn_zone 需要位于 http 上下文。
# Debian/Ubuntu 的 sites-enabled/* 正是在 http{} 内 include 的，直接可用；
# 若你的发行版不是这种结构，请把这两个 zone 定义移到 /etc/nginx/nginx.conf
# 的 http{} 块里。

# ── 限流定义（http 上下文） ──────────────────────────────────────
# 搜索提交接口：每 IP 每分钟最多约 30 次（突发允许 10 个）。
# 正常用户一次搜索只提交 1 次，这个额度非常宽松，只挡脚本/恶意刷接口。
limit_req_zone $binary_remote_addr zone=pf_search:10m rate=30r/m;

# 每 IP 最多 20 个并发连接（浏览器正常开 6-8 个，SSE 长连接占 1-2 个）。
limit_conn_zone $binary_remote_addr zone=pf_conn:10m;

server {
    listen 80;
    server_name photo.example.com;   # ← 改成你的域名

    client_max_body_size 20m;        # 允许上传较大的自拍照片

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    limit_conn pf_conn 20;

    # ── Gradio 队列提交接口：限流（搜索、质量检测都经过这里） ──
    location /queue/join {
        limit_req zone=pf_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── SSE 进度推送通道：不能缓冲，否则进度条不动 ──
    location /queue/data {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;       # 搜索+建索引可能耗时较长
    }

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
