[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photofinder"
version = "0.1.0"
description = "在一拍即传(yipai360)相册中按人脸查找目标人物照片"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "goaltang"},
]
keywords = ["face-recognition", "photo-album", "yipai360", "insightface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "requests>=2.31",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
fast = [
    "faiss-cpu>=1.7",
]

[project.scripts]
photofinder = "photofinder.cli:main"

[project.urls]
Homepage = "https://github.com/goaltang/SearCH"
Repository = "https://github.com/goaltang/SearCH"
Issues = "https://github.com/goaltang/SearCH/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["photofinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
